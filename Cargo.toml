[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tauri = { version = "2.0", features = [] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
redb = "0.24"
async-trait = "0.1.79"

[profile.release]
lto = true
codegen-units = 1